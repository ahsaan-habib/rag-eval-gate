[project]
name = "rag-eval-gate"
version = "0.1.0"
description = "Golden-set evaluation and a CI regression gate for rag-grounded"
requires-python = ">=3.10"
dependencies = [
    "rag-grounded @ git+https://github.com/ahsaan-habib/rag-grounded.git",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["eval*"]
